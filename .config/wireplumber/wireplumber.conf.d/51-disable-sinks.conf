monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*HDMI.*"
      },
      {
        node.name = "~alsa_output.*Lenovo_ThinkPad_USB-C_Dock_Audio.*"
      },
      {
        node.name = "~alsa_output.*pci-0000_0a_00.4.*"
      },
      {
        node.name = "~alsa_input.*FHD_Camera_Microphone.*"
      },
      {
        node.name = "~alsa_input.*Lenovo_ThinkPad_USB-C_Dock_Audio.*"
      },
      {
        node.name = "~alsa_input.*Logitech_StreamCam.*"
      },
      {
        node.name = "~alsa_input.*pci-0000_0a_00.4.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
